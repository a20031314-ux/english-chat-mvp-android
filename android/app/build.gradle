apply plugin: 'com.android.application'

// Signing values live outside the repository. Copy keystore.properties.example
// to android/keystore.properties and fill it in. Without that file the release
// build still runs, but comes out unsigned and Play will refuse it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    // A half-filled file would otherwise fail the build with an obscure error.
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProperties[it]?.trim()
    }
    if (missing) {
        hasKeystore = false
        logger.warn("keystore.properties is missing " + missing.join(", ") + " - the release build will be UNSIGNED.")
    }
} else {
    logger.warn("keystore.properties not found - the release build will be UNSIGNED. See android/keystore.properties.example.")
}

android {
    namespace = "com.yourname.englishchat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yourname.englishchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 70
        versionName "2.56"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                // A relative storeFile is resolved against the android/ directory.
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Installs beside the Play build instead of being refused for a
            // signature clash, so a test build never costs the real app's data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}


/**
 * Refuse to wrap a new version number around an old app.
 *
 * Gradle takes versionName from this file and packages whatever is sitting in
 * src/main/assets/public. Those two have no reason to agree: the assets are
 * only ever refreshed by `npx cap sync`, which runs from `npm run
 * build:android`. Run gradle on its own and the release is a new number around
 * an old bundle, and nothing anywhere says so — not the build, not Play, not
 * the app.
 *
 * It went unnoticed for five releases. 2.52, 2.53 and 2.54 each shipped the
 * bundle built on the 19th, so a learner on "2.54" was running three weeks of
 * code they had never received. The only symptom was the app asking them to
 * update to the version they already had, which reads as a bug in the banner.
 *
 * build-capacitor.mjs checks package.json against versionName, but it lives
 * inside the script that was skipped. This is the same question asked where
 * gradle can hear it.
 */
tasks.named('preBuild').configure {
    doFirst {
        def stamp = file('src/main/assets/public/build-version.txt')
        def want = android.defaultConfig.versionName
        def majorMinor = { String value -> value.split('\\.').take(2).join('.') }
        if (!stamp.exists()) {
            throw new GradleException(
                "No web bundle to package, or one built before this check existed.\n" +
                "Run: npm run build:android    (next build, then npx cap sync android)")
        }
        def got = stamp.text.trim()
        if (majorMinor(got) != majorMinor(want)) {
            throw new GradleException(
                "The packaged web bundle is version ${got}, this release is ${want}.\n" +
                "Gradle would wrap a new number around an old app. Run: npm run build:android")
        }
        logger.lifecycle("Web bundle is version ${got}, matching versionName ${want}.")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
