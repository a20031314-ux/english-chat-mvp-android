// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Pin AndroidX artifacts so AGP 8.7.3 AAR metadata checks pass (transitives may request newer versions).
subprojects { subproject ->
    subproject.configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
            force 'androidx.activity:activity:1.10.0'
            force 'androidx.activity:activity-ktx:1.10.0'
            // @capgo/capacitor-social-login asks for browser 1.9.0, which needs AGP 8.9.1 (2026-10-18). It only uses basic Custom Tabs.
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
