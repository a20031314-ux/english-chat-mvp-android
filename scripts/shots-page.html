<title>languagebank 스크린샷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에 "고른 그림"(사용법 칸마다 한 장), 아래에 기능별로 거르는 스크린샷 격자. 앱처럼 검정 바탕 + 플래티넘. */
:root {
  --bg: #f6f6f3; --panel: #ffffff; --sunk: #ecece8; --line: rgba(20,20,18,.12);
  --ink: #161614; --muted: #5d5d57; --accent: #2b2b27; --accent-ink: #f6f6f3;
  --good: #0f8a5f; --warn: #a66a00; --chip: #e4e4df;
  --sans: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --panel: #121212; --sunk: #0a0a0a; --line: rgba(255,255,255,.12);
  --ink: #f4f4f2; --muted: #9a9a94; --accent: #e8e8e4; --accent-ink: #000000;
  --good: #34d399; --warn: #fcd34d; --chip: #1c1c1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #121212; --sunk: #0a0a0a; --line: rgba(255,255,255,.12);
  --ink: #f4f4f2; --muted: #9a9a94; --accent: #e8e8e4; --accent-ink: #000000;
  --good: #34d399; --warn: #fcd34d; --chip: #1c1c1b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5 }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance }
h2 { font-size: 15px; font-weight: 600; margin: 0 }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
select, input[type=search] { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; min-width: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px }
.shot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0 }
.shot button.img { all: unset; cursor: zoom-in; display: block; background: var(--sunk); aspect-ratio: 412 / 860; overflow: hidden }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block }
.meta { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.t { font-size: 13px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere }
.tags { display: flex; flex-wrap: wrap; gap: 4px }
.tag { font-size: 11px; color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 1px 6px }
.used { font-size: 11px; color: var(--good) }
.picks { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px }
.prow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; min-width: 0 }
.prow img { width: 44px; height: 92px; object-fit: cover; object-position: top; border-radius: 6px; background: var(--sunk) }
.state { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor }
.state.wait { color: var(--warn) } .state.done { color: var(--good) }
.link { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; text-decoration: underline }
.empty { color: var(--muted); padding: 28px 0; text-align: center }
.views { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.views button { font: inherit; font-size: 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 10px; cursor: pointer }
.views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600 }
.badge { font-size: 11px; border-radius: 6px; padding: 1px 6px; border: 1px solid currentColor }
.badge.trash { color: var(--warn) } .badge.keep { color: var(--good) } .badge.map { color: var(--muted) }
.need { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0 }
.need code { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.same { display: flex; gap: 6px; overflow-x: auto }
.same button { all: unset; cursor: pointer; flex: none; width: 54px; border-radius: 6px; overflow: hidden; border: 2px solid transparent }
.same button[aria-current="true"] { border-color: var(--accent) }
.same img { width: 54px; height: 112px; object-fit: cover; object-position: top; display: block }
dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 520px) }
dialog::backdrop { background: rgba(0,0,0,.72) }
.big { background: var(--panel); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column }
.big img { max-height: 70vh; width: auto; margin: 0 auto; display: block }
.big .meta { gap: 10px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { font: inherit; font-size: 13px; border-radius: 10px; padding: 7px 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.note { font-size: 12px; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .shot { transition: border-color .15s } .shot:hover { border-color: var(--accent) } }
</style>

<div class="wrap">
  <header>
    <h1>기능 스크린샷</h1>
    <p class="sub">기능을 만들거나 점검하며 찍은 화면이 여기 모여요. 그림을 눌러 사용법 칸이나 지도 칸을 고르면 다음 갱신 때 그 그림이 들어가요. 고르지 않은 칸은 한국어 앱 화면을 먼저, 다른 언어 조합을 보조로 자동으로 붙여요.</p>
  </header>

  <section class="picks" aria-labelledby="picks-h">
    <div class="row" style="justify-content:space-between"><h2 id="picks-h">사용법에 넣기로 고른 그림</h2><span class="mono" id="pick-count"></span></div>
    <div id="picks"><p class="note">아직 고른 그림이 없어요. 아래 스크린샷을 눌러 칸을 골라 보세요.</p></div>
  </section>

  <section aria-labelledby="all-h" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="all-h" hidden>스크린샷</h2>
    <div class="views" role="tablist" aria-label="보기">
      <button type="button" role="tab" id="view-all" aria-selected="true">스크린샷 <span class="mono" id="count"></span></button>
      <button type="button" role="tab" id="view-needs" aria-selected="false">그림이 필요한 칸 <span class="mono" id="needs-count"></span></button>
      <button type="button" role="tab" id="view-trash" aria-selected="false">정리 예정 <span class="mono" id="trash-count"></span></button>
    </div>
    <p class="note" id="view-note"></p>
    <div id="needs" hidden></div>
    <div class="bar" id="areas" role="group" aria-label="기능"></div>
    <div class="bar">
      <select id="date" aria-label="날짜"><option value="">모든 날짜</option></select>
      <select id="lang" aria-label="앱 언어"><option value="">모든 언어 조합</option></select>
      <input type="search" id="q" placeholder="찾기 (예: 방장, 자막)" aria-label="찾기">
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>스크린샷을 불러오는 중이에요. 처음이면 Claude가 올린 뒤 여기에 보여요.</p>
  </section>
</div>

<dialog id="view">
  <div class="big">
    <img id="v-img" alt="">
    <div class="meta">
      <div class="t" id="v-title"></div>
      <div class="tags" id="v-tags"></div>
      <div class="same" id="v-same" aria-label="같은 장면의 다른 언어 조합"></div>
      <div class="row"><button class="btn" id="v-keep" type="button">남기기</button><span class="note" id="v-keepnote"></span></div>
      <label class="note" for="v-sec">사용법 칸에 넣기</label>
      <div class="row">
        <select id="v-sec" style="flex:1"></select>
        <button class="btn primary" id="v-pick" type="button">이 칸으로</button>
      </div>
      <p class="note" id="v-msg" aria-live="polite"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="v-close" type="button">닫기</button></div>
    </div>
  </div>
</dialog>

<script>
const SECTIONS = [{"chapter": "AI 채팅", "id": "chat.next", "heading": "오늘 해볼 것으로 시작", "shot": "chatnext"}, {"chapter": "AI 채팅", "id": "chat.talk", "heading": "배우는 언어로 대화하기", "shot": "chat-correct"}, {"chapter": "AI 채팅", "id": "chat.stuck", "heading": "막히면 내 언어로", "shot": "chat-expression"}, {"chapter": "AI 채팅", "id": "chat.meaning", "heading": "뜻 보기와 듣기", "shot": "chat-reading"}, {"chapter": "AI 채팅", "id": "chat.analyse", "heading": "문장 분석과 질문", "shot": "chat-ask"}, {"chapter": "AI 채팅", "id": "chat.words", "heading": "단어를 눌러 단어장에", "shot": "chat-word"}, {"chapter": "AI 채팅", "id": "chat.menu", "heading": "메뉴", "shot": "chat-menu"}, {"chapter": "AI 채팅", "id": "chat.history", "heading": "지난 대화 이어 하기", "shot": "chat-history"}, {"chapter": "AI 채팅", "id": "chat.more", "heading": "그 밖에", "shot": null}, {"chapter": "AI 통화", "id": "call.pack", "heading": "오늘의 팩", "shot": "call-pack"}, {"chapter": "AI 통화", "id": "call.talk", "heading": "말로 대화하기", "shot": "call-talk"}, {"chapter": "AI 통화", "id": "call.review", "heading": "끝난 대화 돌아보기", "shot": "call-review"}, {"chapter": "AI 통화", "id": "call.ownline", "heading": "내 문장으로 말해 보기", "shot": "call-ownline"}, {"chapter": "AI 통화", "id": "call.pause", "heading": "멈추고 이어서 하기", "shot": null}, {"chapter": "AI 통화", "id": "call.time", "heading": "통화 시간", "shot": null}, {"chapter": "대화", "id": "talk.list", "heading": "대화 목록", "shot": "talk-list"}, {"chapter": "대화", "id": "messages.dm", "heading": "메시지와 통화", "shot": null}, {"chapter": "대화", "id": "messages.groups", "heading": "단체방과 단체 통화", "shot": "r69-groups"}, {"chapter": "영상 학습", "id": "video.library", "heading": "이달의 영상", "shot": "video-library"}, {"chapter": "영상 학습", "id": "video.subtitles", "heading": "자막은 배우는 언어로만", "shot": "video-study"}, {"chapter": "영상 학습", "id": "video.bar", "heading": "번역은 문장 왼쪽 막대로", "shot": "video-bar"}, {"chapter": "영상 학습", "id": "video.ask", "heading": "궁금한 부분 물어보기", "shot": "video-ask"}, {"chapter": "영상 학습", "id": "video.import", "heading": "내 영상 가져오기", "shot": null}, {"chapter": "영상 학습", "id": "video.edit", "heading": "구간 묶기·쪼개기와 저장", "shot": null}, {"chapter": "사람", "id": "people.find", "heading": "사람 찾기", "shot": "r69-people"}, {"chapter": "사람", "id": "people.invite", "heading": "친구 초대", "shot": null}, {"chapter": "사람", "id": "people.rewards", "heading": "친구 초대 보상", "shot": "invite-rewards"}, {"chapter": "사람", "id": "people.board", "heading": "게시판", "shot": "r69-board"}, {"chapter": "Room", "id": "room.find", "heading": "방 찾고 들어가기", "shot": "r69-free"}, {"chapter": "Room", "id": "room.layouts", "heading": "참여 방식·보는 방식", "shot": "r69-layouts"}, {"chapter": "Room", "id": "room.quote", "heading": "줄을 집어서 묻기", "shot": "r69-quote"}, {"chapter": "Room", "id": "room.stuck", "heading": "말이 막힐 때", "shot": "r69-hint"}, {"chapter": "Room", "id": "room.host", "heading": "방장이라면", "shot": "r69-host"}, {"chapter": "My", "id": "my.start", "heading": "1. 체크로 시작", "shot": "goal"}, {"chapter": "My", "id": "my.next", "heading": "2. 오늘 해볼 것", "shot": "next"}, {"chapter": "My", "id": "my.growth", "heading": "3. 자라는 중", "shot": "growth"}, {"chapter": "My", "id": "my.graph", "heading": "4. 그래프로 보기", "shot": "graph"}, {"chapter": "My", "id": "my.element", "heading": "5. 눌러서 보기", "shot": "element"}, {"chapter": "My", "id": "my.ask", "heading": "6. 직접 묻기", "shot": "myask"}, {"chapter": "My", "id": "my.map", "heading": "7. 지도로 보기", "shot": "mapview"}, {"chapter": "My", "id": "my.more", "heading": "그 밖에", "shot": null}, {"chapter": "노트·단어장", "id": "my.notes", "heading": "8. 노트", "shot": "notes"}, {"chapter": "노트·단어장", "id": "words.find", "heading": "찾고 저장하기", "shot": "vocab-search"}, {"chapter": "노트·단어장", "id": "words.saved", "heading": "저장한 단어", "shot": "vocab-saved"}, {"chapter": "노트·단어장", "id": "words.learn", "heading": "외우기", "shot": "vocab-hide"}, {"chapter": "노트·단어장", "id": "words.script", "heading": "글자 익히기", "shot": "vocab-characters"}, {"chapter": "그 밖에", "id": "other.whatsnew", "heading": "새로워진 점 안내", "shot": null}, {"chapter": "그 밖에", "id": "other.store", "heading": "스토어 스크린샷", "shot": null}, {"chapter": "그 밖에", "id": "other.door", "heading": "창구 소개 페이지", "shot": null}];
const AREA = { room: "Room", talk: "대화·메시지", people: "사람", web: "웹·창구", billing: "결제", chat: "AI 채팅", call: "AI 통화", video: "영상", my: "My", shell: "앱 틀" };
const LANG = { ko: "ja 학습 · ko 앱", ja: "en 학습 · ja 앱", ar: "es 학습 · ar 앱" };
let shots = [], picks = {}, meta = null, area = "", db = null, current = null, view = "all";
const TRASH_DAYS = 7;
const addDays = (date, n) => { const d = new Date(date + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate(); };
const usedInMap = (id) => Boolean(meta && (meta.used || []).includes(id));
const $ = (id) => document.getElementById(id);
const secName = (id) => { if (id.startsWith("node.")) { const n = meta && (meta.nodes || []).find((x) => "node." + x.id === id); return "지도 › " + (n ? n.title : id.slice(5)); } const s = SECTIONS.find((x) => x.id === id); return s ? s.chapter + " › " + s.heading : id; };

// 칸 고르기 목록(묶음별)
(function fillSections() {
  const sel = $("v-sec"); const groups = {};
  for (const s of SECTIONS) (groups[s.chapter] ||= []).push(s);
  for (const [name, list] of Object.entries(groups)) {
    const g = document.createElement("optgroup"); g.label = name;
    for (const s of list) { const o = document.createElement("option"); o.value = s.id; o.textContent = s.heading + (s.shot ? "" : " (지금 그림 없음)"); g.appendChild(o); }
    sel.appendChild(g);
  }
})();

function fillNodeOptions() {
  const sel = $("v-sec"); sel.querySelector("optgroup[data-nodes]")?.remove();
  if (!meta || !meta.nodes) return;
  const g = document.createElement("optgroup"); g.label = "지도 칸 대표 그림"; g.dataset.nodes = "1";
  for (const n of meta.nodes) { const o = document.createElement("option"); o.value = "node." + n.id; o.textContent = n.title; g.appendChild(o); }
  sel.prepend(g);
}
function usedBy(shotId) { return Object.entries(picks).filter(([, p]) => p.shotId === shotId).map(([sec]) => sec); }

function render() {
  const date = $("date").value, lang = $("lang").value, q = $("q").value.trim().toLowerCase();
  const trash = shots.filter((s) => s.trash);
  $("trash-count").textContent = trash.length || "";
  $("needs-count").textContent = meta && meta.needs ? meta.needs.length || "" : "";
  const pool = view === "trash" ? trash : shots.filter((s) => !s.trash);
  const list = pool.filter((s) => (!area || s.area === area) && (!date || s.date === date) && (!lang || s.lang === lang) && (!q || (s.title + " " + s.file).toLowerCase().includes(q)));
  $("count").textContent = shots.length - trash.length;
  $("view-note").textContent = view === "trash" ? "표시한 날부터 " + TRASH_DAYS + "일 뒤 지워져요. 남기려면 눌러서 ‘남기기’." : view === "needs" ? "사용법·지도에 아직 그림이 없는 칸이에요. 다음 점검 때 찍어 올려요." : "한국어 앱 화면이 먼저 쓰이고, 다른 언어 조합은 보조로 붙어요.";
  $("grid").hidden = view === "needs"; $("needs").hidden = view !== "needs"; $("areas").hidden = view === "needs";
  if (view === "needs") renderNeeds();
  const grid = $("grid"); grid.replaceChildren();
  for (const s of list) {
    const card = document.createElement("article"); card.className = "shot";
    const b = document.createElement("button"); b.className = "img"; b.type = "button"; b.setAttribute("aria-label", s.title + " 크게 보기");
    const img = document.createElement("img"); img.loading = "lazy"; img.src = s.url; img.alt = s.title; b.appendChild(img);
    b.addEventListener("click", () => open(s));
    const m = document.createElement("div"); m.className = "meta";
    const t = document.createElement("div"); t.className = "t"; t.textContent = s.title;
    const tags = document.createElement("div"); tags.className = "tags";
    for (const v of [AREA[s.area] || s.area, LANG[s.lang] || s.lang, s.date, s.source]) if (v) { const g = document.createElement("span"); g.className = "tag"; g.textContent = v; tags.appendChild(g); }
    const badge = (cls, text) => { const g = document.createElement("span"); g.className = "badge " + cls; g.textContent = text; tags.appendChild(g); };
    if (s.trash) badge("trash", "정리 예정 · " + s.trash.reason + " · " + addDays(s.trash.at, TRASH_DAYS) + " 지움");
    if (s.keep) badge("keep", "남김");
    if (usedInMap(s.id)) badge("map", "지도에 씀");
    m.append(t, tags);
    const u = usedBy(s.id); if (u.length) { const x = document.createElement("div"); x.className = "used"; x.textContent = "✓ " + u.map(secName).join(", "); m.appendChild(x); }
    card.append(b, m); grid.appendChild(card);
  }
  $("empty").hidden = shots.length > 0;
  if (shots.length && !list.length) { $("empty").hidden = false; $("empty").textContent = "조건에 맞는 스크린샷이 없어요."; }
  renderPicks();
}

function renderPicks() {
  const box = $("picks"); const rows = Object.entries(picks).sort(([a], [b]) => SECTIONS.findIndex((s) => s.id === a) - SECTIONS.findIndex((s) => s.id === b));
  $("pick-count").textContent = rows.length ? rows.length + "칸" : "";
  if (!rows.length) { box.innerHTML = '<p class="note">아직 고른 그림이 없어요. 아래 스크린샷을 눌러 칸을 골라 보세요.</p>'; return; }
  box.replaceChildren();
  for (const [sec, p] of rows) {
    const s = shots.find((x) => x.id === p.shotId); const r = document.createElement("div"); r.className = "prow";
    const img = document.createElement("img"); img.alt = ""; if (s) img.src = s.url;
    const mid = document.createElement("div"); mid.style.minWidth = "0";
    const a = document.createElement("div"); a.className = "t"; a.textContent = secName(sec);
    const b = document.createElement("div"); b.className = "note"; b.textContent = s ? s.title : "(지워진 그림)";
    mid.append(a, b);
    const right = document.createElement("div"); right.className = "row"; right.style.justifyContent = "flex-end";
    const st = document.createElement("span"); st.className = "state " + (p.applied ? "done" : "wait"); st.textContent = p.applied ? "사용법에 들어감" : "넣기 대기";
    right.appendChild(st);
    if (db && !p.applied) { const x = document.createElement("button"); x.className = "link"; x.type = "button"; x.textContent = "빼기"; x.addEventListener("click", () => unpick(sec)); right.appendChild(x); }
    r.append(img, mid, right); box.appendChild(r);
  }
}

function renderNeeds() {
  const box = $("needs"); box.replaceChildren();
  const list = (meta && meta.needs) || [];
  if (!list.length) { box.innerHTML = '<p class="empty">그림이 필요한 칸이 없어요.</p>'; return; }
  for (const n of list) { const r = document.createElement("div"); r.className = "need"; const a = document.createElement("span"); a.textContent = n.label; const c = document.createElement("code"); c.textContent = n.key; r.append(a, c); box.appendChild(r); }
}
function setView(v) {
  view = v;
  for (const [id, name] of [["view-all", "all"], ["view-needs", "needs"], ["view-trash", "trash"]]) $(id).setAttribute("aria-selected", String(v === name));
  render();
}
async function toggleKeep() {
  if (!db || !current) return;
  const next = !current.keep;
  $("v-keep").disabled = true;
  try {
    await db.doc("shots/" + current.id).update(next ? { keep: true, trash: null } : { keep: false });
    current = { ...current, keep: next, trash: next ? null : current.trash };
    $("v-keepnote").textContent = next ? "남겼어요. 자동 정리에서 빠져요." : "남기기를 풀었어요.";
    $("v-keep").textContent = next ? "남기기 풀기" : "남기기";
  } catch { $("v-keepnote").textContent = "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
  $("v-keep").disabled = false;
}

function open(s) {
  current = s; $("v-img").src = s.url; $("v-img").alt = s.title; $("v-title").textContent = s.title;
  const tags = $("v-tags"); tags.replaceChildren();
  for (const v of [AREA[s.area] || s.area, LANG[s.lang] || s.lang, s.date, s.source, s.file]) if (v) { const g = document.createElement("span"); g.className = "tag"; g.textContent = v; tags.appendChild(g); }
  const same = shots.filter((x) => x.node && x.node === s.node && x.scene === s.scene && !x.trash).sort((a, b) => (a.lang === "ko" ? -1 : 0) - (b.lang === "ko" ? -1 : 0));
  const sameBox = $("v-same"); sameBox.replaceChildren();
  if (same.length > 1) for (const x of same) { const b = document.createElement("button"); b.type = "button"; b.title = LANG[x.lang] || x.lang || ""; if (x.id === s.id) b.setAttribute("aria-current", "true"); const i = document.createElement("img"); i.src = x.url; i.alt = b.title; b.appendChild(i); b.addEventListener("click", () => open(x)); sameBox.appendChild(b); }
  $("v-keep").textContent = s.keep ? "남기기 풀기" : "남기기"; $("v-keep").disabled = !db;
  $("v-keepnote").textContent = s.trash ? "정리 예정: " + s.trash.reason + " · " + addDays(s.trash.at, TRASH_DAYS) + "에 지워져요." : s.keep ? "남긴 그림이에요." : "";
  const u = usedBy(s.id); $("v-msg").textContent = u.length ? "이미 고른 칸: " + u.map(secName).join(", ") : "";
  $("v-pick").disabled = !db; if (!db) $("v-msg").textContent = "이 화면에서는 고를 수 없어요(로그인한 소유자만).";
  if (!$("view").open) $("view").showModal();
}

async function pick() {
  if (!db || !current) return; const sec = $("v-sec").value;
  $("v-pick").disabled = true;
  try {
    await db.doc("picks/" + sec).set({ shotId: current.id, url: current.url, file: current.file, at: Date.now(), applied: false });
    $("v-msg").textContent = "골랐어요: " + secName(sec) + ". 다음 작업 때 사용법에 들어가요.";
  } catch (e) { $("v-msg").textContent = "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
  $("v-pick").disabled = false;
}
async function unpick(sec) { try { await db.doc("picks/" + sec).delete(); } catch {} }

function fillFilters() {
  const areas = [...new Set(shots.map((s) => s.area))];
  const bar = $("areas"); bar.replaceChildren();
  for (const [v, label] of [["", "전체"], ...areas.map((a) => [a, AREA[a] || a])]) {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = label; c.setAttribute("aria-pressed", String(area === v));
    c.addEventListener("click", () => { area = v; fillFilters(); render(); }); bar.appendChild(c);
  }
  const keep = (id, values, label) => { const sel = $(id); const was = sel.value; sel.replaceChildren(new Option(label, "")); for (const v of values) sel.appendChild(new Option(id === "lang" ? (LANG[v] || v) : v, v)); sel.value = values.includes(was) ? was : ""; };
  keep("date", [...new Set(shots.map((s) => s.date))].sort().reverse(), "모든 날짜");
  keep("lang", [...new Set(shots.map((s) => s.lang).filter(Boolean))], "모든 언어 조합");
}

for (const id of ["date", "lang"]) $(id).addEventListener("change", render);
$("q").addEventListener("input", render);
$("v-pick").addEventListener("click", pick);
$("v-keep").addEventListener("click", toggleKeep);
$("view-all").addEventListener("click", () => setView("all"));
$("view-needs").addEventListener("click", () => setView("needs"));
$("view-trash").addEventListener("click", () => setView("trash"));
$("v-close").addEventListener("click", () => $("view").close());
$("view").addEventListener("click", (e) => { if (e.target === $("view")) $("view").close(); });
render();

(async () => {
  db = await window.claude?.use?.("db");
  if (!db) { $("empty").textContent = "스크린샷을 불러올 수 없어요. 로그인한 상태로 다시 열어 주세요."; return; }
  db.collection("shots").orderBy("order", "desc").onSnapshot((snap) => {
    shots = snap.docs.map((d) => ({ id: d.id, ...d.data() })); fillFilters(); render();
  }, () => { $("empty").textContent = "스크린샷을 불러오지 못했어요."; });
  db.collection("picks").onSnapshot((snap) => { picks = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); render(); });
  // Claude가 정리·지도 계산 뒤 남기는 요약: 그림이 필요한 칸, 지도에 쓰는 그림, 지도 칸 목록.
  db.doc("meta/plan").onSnapshot((d) => { meta = d.exists ? d.data() : null; fillNodeOptions(); render(); });
})();
</script>
