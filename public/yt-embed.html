<!doctype html>
<!--
  iOS 앱용 YouTube 중계 페이지 (2026-10-20).

  YouTube 퍼가기 플레이어는 띄운 사이트를 Referer로 알려야 재생한다(없으면 "오류 153").
  안드로이드 앱 화면은 https://localhost라 Referer가 가지만, iOS 앱 화면은 capacitor://localhost라
  https로 가는 요청에 Referer가 붙지 않는다. 그래서 iOS 앱은 이 페이지(우리 https 도메인)를
  iframe으로 띄우고, 이 페이지가 YouTube 플레이어를 띄운다. 앱 ↔ 이 페이지는 postMessage:
    앱 → 페이지: {lbYt:"cmd", fn:"playVideo"|"pauseVideo"|"seekTo"|"mute"|"unMute", args:[...]}
    페이지 → 앱: {lbYt:"ready"|"state"|"error"|"tick", ...} — tick은 0.25초마다 시간·상태·길이.
  짝: src/components/videoLearning/relayPlayer.ts. 바꾸면 둘 다.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 상태 줄: 아이폰에서만 생기는 문제를 맥 없이 보려고(2026-10-20). 재생이 시작되면 사라진다. */
  #s { position: absolute; left: 8px; bottom: 6px; font: 11px -apple-system, system-ui, sans-serif; color: #8a8f98; pointer-events: none; }
</style>
</head>
<body>
<div id="p"></div>
<div id="s">relay · start</div>
<script>
(function () {
  // 앱 화면만 명령을 보낼 수 있다(다른 사이트가 이 페이지를 띄워 조종하지 못하게).
  var ALLOWED = ["capacitor://localhost", "https://localhost", "http://localhost", "ionic://localhost"];
  var q = new URLSearchParams(location.search);
  var videoId = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20);
  var player = null;
  var ready = false;
  var statusEl = document.getElementById("s");
  var gotCommand = false;
  function status(text) { if (statusEl) statusEl.textContent = "relay · " + text + (gotCommand ? " · cmd ok" : ""); }

  // 보내는 값은 시간·상태뿐이라 받는 쪽을 "*"로 둔다. iOS 웹뷰가 capacitor:// 부모의 origin을
  // 다르게 보면 지정한 origin으로 보낸 메시지가 조용히 버려져 앱이 플레이어 준비를 영영 모른다.
  function send(msg) {
    msg.lbYt = msg.lbYt || "tick";
    try { parent.postMessage(msg, "*"); } catch (e) {}
  }

  // 명령은 이 페이지를 띄운 부모 창에서 온 것만 받는다(origin 문자열 대신 보낸 창으로 확인).
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent && ALLOWED.indexOf(event.origin) < 0) return;
    var data = event.data;
    if (!data || data.lbYt !== "cmd") return;
    if (!gotCommand) { gotCommand = true; status(ready ? "ready" : "waiting"); }
    if (!player || !ready) return;
    var fn = data.fn;
    var args = Array.isArray(data.args) ? data.args : [];
    if (["playVideo", "pauseVideo", "seekTo", "mute", "unMute"].indexOf(fn) < 0) return;
    try { player[fn].apply(player, args); } catch (e) {}
  });

  window.onYouTubeIframeAPIReady = function () {
    status("api ok");
    player = new YT.Player("p", {
      videoId: videoId,
      width: "100%",
      height: "100%",
      playerVars: {
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        enablejsapi: 1,
        controls: 1,
        origin: location.origin,
        autoplay: q.get("autoplay") === "1" ? 1 : 0
      },
      events: {
        onReady: function () {
          ready = true;
          status("ready");
          var d = 0;
          try { d = player.getDuration(); } catch (e) {}
          send({ lbYt: "ready", duration: d });
          setInterval(function () {
            var t = 0, s = -1, dur = 0;
            try { t = player.getCurrentTime(); s = player.getPlayerState(); dur = player.getDuration(); } catch (e) {}
            send({ lbYt: "tick", time: t, state: s, duration: dur });
          }, 250);
        },
        onStateChange: function (e) {
          if (e.data === 1 && statusEl) statusEl.style.display = "none";
          send({ lbYt: "state", state: e.data });
        },
        onError: function (e) { status("error " + (e && e.data)); send({ lbYt: "error", code: e && e.data }); }
      }
    });
  };

  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.async = true;
  s.onerror = function () { status("api failed"); send({ lbYt: "error", code: "api" }); };
  status("api loading");
  document.head.appendChild(s);
})();
</script>
</body>
</html>
