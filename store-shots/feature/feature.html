<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1024px;height:500px;overflow:hidden;background:#15161A;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(520px 360px at 78% 30%,rgba(52,211,153,.16),transparent 70%),radial-gradient(420px 300px at 10% 110%,rgba(56,189,248,.10),transparent 70%)}
.left{position:absolute;left:64px;top:0;bottom:0;width:430px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:14px}
.brand span{font-size:30px;font-weight:800;letter-spacing:-.01em}
h1{margin:30px 0 0;font-size:48px;line-height:1.08;font-weight:900;letter-spacing:-.025em}
h1 em{font-style:normal;color:#34D399}
p{margin:18px 0 0;font-size:19px;line-height:1.45;color:#B7B8BF}
.chips{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.chips span{font-size:14px;color:#E8E8E4;border:1px solid #34353C;border-radius:999px;padding:6px 12px}
.phone{position:absolute;width:224px;border-radius:30px;border:8px solid #000;outline:2px solid #34353C;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.phone img{display:block;width:100%}
.p1{left:548px;top:96px;transform:rotate(-6deg);opacity:.9}
.p2{left:690px;top:40px;width:250px;z-index:2}
.p3{left:860px;top:120px;transform:rotate(6deg);opacity:.9}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="icon.png" alt=""><span>languagebank</span></div>
  <h1>Say it first.<br><em>Fixes</em> come right<br>under your line.</h1>
  <p>Chat, call and learn with people in the language you're learning — 14 languages.</p>
  <div class="chips"><span>AI tutor</span><span>Voice calls</span><span>Real videos</span><span>Study rooms</span></div>
</div>
<div class="phone p1"><img src="growth.png" alt=""></div>
<div class="phone p3"><img src="board.png" alt=""></div>
<div class="phone p2"><img src="chat-correct.png" alt=""></div>
</body></html>
