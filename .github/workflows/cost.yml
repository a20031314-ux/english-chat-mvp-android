# 기능이 늘거나 요금·단가가 바뀔 때마다 비용 구조를 다시 계산한다 (hub/costs.md).
#
# - 모든 push·PR: 기능(op)마다 단가가 있는지(opCost.test.ts), 모델을 쓰는 서버
#   경로가 사용량을 기록하는지(cost-coverage.mjs). 빠지면 실패.
# - main push: scripts/plan-cost.mjs로 hub/costs.md를 다시 만들고, 바뀌었으면 커밋.
#   허브만 바뀐 커밋이라 Vercel은 다시 배포하지 않는다(vercel.json).
# - PR: 이 PR로 비용 표가 어떻게 바뀌는지 실행 요약에 보여 준다.
# 모델을 부르지 않고 키도 필요 없다.
name: cost

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 기능별 단가가 빠짐없는지
        run: node --experimental-strip-types --no-warnings --test src/lib/billing/opCost.test.ts src/lib/billing/cost.test.ts src/lib/billing/plans.test.ts
      - name: 모델 쓰는 경로가 사용량을 기록하는지
        run: node scripts/cost-coverage.mjs
      - name: 비용 표 다시 계산
        run: node --experimental-strip-types --no-warnings scripts/plan-cost.mjs
      - name: 바뀐 비용 표 (실행 요약)
        run: |
          {
            echo "## 비용 표"
            if git diff --quiet -- hub/costs.md; then
              echo "바뀐 것 없음."
            else
              echo '```diff'
              git diff -- hub/costs.md | sed -n '5,200p'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: main이면 hub/costs.md 커밋
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- hub/costs.md; then
            echo "비용 표 그대로"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/costs.md
          git commit -m "비용 표 자동 갱신 (${GITHUB_SHA::7} 기준)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
