# 앱 전체구조(hub/STRUCTURE.md)가 코드보다 뒤처지지 않게 한다.
#
# - 모든 push·PR: 화면 코드(src/components)·API(src/app/api)·웹 페이지마다 scripts/structure.json에 영역이 있는지,
#   아무것도 안 가리키는 키가 남지 않았는지. 어긋나면 실패.
# - main push: scripts/structure.mjs로 hub/STRUCTURE.md 자동 부분을 다시 만들고, 바뀌었으면 커밋
#   (허브만 바뀐 커밋이라 Vercel은 다시 배포하지 않음). 손으로 쓴 위쪽은 건드리지 않는다.
# 키·네트워크가 필요 없다.
name: structure

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: structure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 화면·API·페이지마다 영역이 있는지
        run: node scripts/structure.mjs --check --assign-only
      - name: 전체구조 자동 부분 다시 만들기
        run: node scripts/structure.mjs
      - name: main이면 hub/STRUCTURE.md 커밋
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- hub/STRUCTURE.md; then
            echo "전체구조 그대로"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/STRUCTURE.md
          git commit -m "전체구조 자동 갱신 (${GITHUB_SHA::7} 기준)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
