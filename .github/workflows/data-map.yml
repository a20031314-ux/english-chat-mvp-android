# 서버가 저장하는 키가 바뀔 때마다 데이터 지도(hub/data-map.md)를 다시 만든다.
#
# - 모든 push·PR: 새 키 묶음에 설명(scripts/data-map.json)이 있는지, 코드에서 사라진 묶음이 설명에 남아 있지 않은지. 어긋나면 실패.
# - main push: scripts/data-map.mjs로 hub/data-map.md를 다시 만들고, 바뀌었으면 커밋(허브만 바뀐 커밋이라 Vercel은 다시 배포하지 않음).
# 키·네트워크가 필요 없다.
name: data-map

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: data-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 저장 키마다 설명이 있는지
        run: node scripts/data-map.mjs --check --notes-only
      - name: 데이터 지도 다시 만들기
        run: node scripts/data-map.mjs
      - name: main이면 hub/data-map.md 커밋
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- hub/data-map.md; then
            echo "데이터 지도 그대로"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/data-map.md
          git commit -m "데이터 지도 자동 갱신 (${GITHUB_SHA::7} 기준)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
